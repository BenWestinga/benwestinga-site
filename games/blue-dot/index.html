```html
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Dot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
            font-family: Arial, sans-serif;
        }

        #menu {
            width: 100vw;
            height: 100vh;
            border: 8px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #playButton {
            padding: 20px 60px;
            font-size: clamp(30px, 6vw, 70px);
            font-weight: bold;
            background: white;
            border: 6px solid black;
            cursor: pointer;
        }

        #playButton:hover {
            background: black;
            color: white;
        }

        #gameScreen {
            display: none;
            position: fixed;
            inset: 0;
            border: 8px solid black;
            background: white;
            overflow: hidden;
        }

        .dot {
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #player {
            width: 26px;
            height: 26px;
            background: red;
        }

        #blueDot {
            width: 36px;
            height: 36px;
            background: blue;
        }
    </style>
</head>

<body>

    <div id="menu">
        <button id="playButton">SPEEL</button>
    </div>

    <div id="gameScreen">
        <div id="player" class="dot"></div>
        <div id="blueDot" class="dot"></div>
    </div>

    <script>
        const menu = document.getElementById("menu");
        const gameScreen = document.getElementById("gameScreen");
        const playButton = document.getElementById("playButton");

        const player = document.getElementById("player");
        const blueDot = document.getElementById("blueDot");

        const keys = {
            ArrowUp: false,
            ArrowDown: false,
            ArrowLeft: false,
            ArrowRight: false
        };

        let playerX;
        let playerY;

        let blueX;
        let blueY;

        let blueVX;
        let blueVY;

        let animationFrame;

        const playerSpeed = 4;
        const blueSpeed = 3;

        function startGame() {
            menu.style.display = "none";
            gameScreen.style.display = "block";

            const width = gameScreen.clientWidth;
            const height = gameScreen.clientHeight;

            const playerRadius = player.offsetWidth / 2;
            const blueRadius = blueDot.offsetWidth / 2;

            playerX = width * 0.25;
            playerY = height * 0.5;

            blueX = width * 0.70;
            blueY = height * 0.30;

            const angle = Math.random() * Math.PI * 2;

            blueVX = Math.cos(angle) * blueSpeed;
            blueVY = Math.sin(angle) * blueSpeed;

            playerX = clamp(playerX, playerRadius, width - playerRadius);
            playerY = clamp(playerY, playerRadius, height - playerRadius);

            blueX = clamp(blueX, blueRadius, width - blueRadius);
            blueY = clamp(blueY, blueRadius, height - blueRadius);

            cancelAnimationFrame(animationFrame);
            gameLoop();
        }

        function endGame() {
            cancelAnimationFrame(animationFrame);
            animationFrame = null;

            gameScreen.style.display = "none";
            menu.style.display = "flex";
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function gameLoop() {
            const width = gameScreen.clientWidth;
            const height = gameScreen.clientHeight;

            const playerRadius = player.offsetWidth / 2;
            const blueRadius = blueDot.offsetWidth / 2;

            // Rode bal
            if (keys.ArrowUp) {
                playerY -= playerSpeed;
            }

            if (keys.ArrowDown) {
                playerY += playerSpeed;
            }

            if (keys.ArrowLeft) {
                playerX -= playerSpeed;
            }

            if (keys.ArrowRight) {
                playerX += playerSpeed;
            }

            // Rode bal volledig binnen de zwarte rand houden
            playerX = clamp(
                playerX,
                playerRadius,
                width - playerRadius
            );

            playerY = clamp(
                playerY,
                playerRadius,
                height - playerRadius
            );

            // Blauwe bal bewegen
            blueX += blueVX;
            blueY += blueVY;

            // Links
            if (blueX - blueRadius <= 0) {
                blueX = blueRadius;
                blueVX = Math.abs(blueVX);
            }

            // Rechts
            if (blueX + blueRadius >= width) {
                blueX = width - blueRadius;
                blueVX = -Math.abs(blueVX);
            }

            // Boven
            if (blueY - blueRadius <= 0) {
                blueY = blueRadius;
                blueVY = Math.abs(blueVY);
            }

            // Onder
            if (blueY + blueRadius >= height) {
                blueY = height - blueRadius;
                blueVY = -Math.abs(blueVY);
            }

            // Posities tekenen
            player.style.left = playerX + "px";
            player.style.top = playerY + "px";

            blueDot.style.left = blueX + "px";
            blueDot.style.top = blueY + "px";

            // Botsing controleren
            const dx = playerX - blueX;
            const dy = playerY - blueY;

            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance <= playerRadius + blueRadius) {
                endGame();
                return;
            }

            animationFrame = requestAnimationFrame(gameLoop);
        }

        // Toetsen
        document.addEventListener("keydown", function(event) {
            if (event.key in keys) {
                keys[event.key] = true;
                event.preventDefault();
            }
        });

        document.addEventListener("keyup", function(event) {
            if (event.key in keys) {
                keys[event.key] = false;
                event.preventDefault();
            }
        });

        // Spelen
        playButton.addEventListener("click", startGame);

        // Schermgrootte verandert
        window.addEventListener("resize", function() {
            if (gameScreen.style.display === "none") {
                return;
            }

            const width = gameScreen.clientWidth;
            const height = gameScreen.clientHeight;

            const playerRadius = player.offsetWidth / 2;
            const blueRadius = blueDot.offsetWidth / 2;

            playerX = clamp(playerX, playerRadius, width - playerRadius);
            playerY = clamp(playerY, playerRadius, height - playerRadius);

            blueX = clamp(blueX, blueRadius, width - blueRadius);
            blueY = clamp(blueY, blueRadius, height - blueRadius);
        });
    </script>

</body>
</html>
