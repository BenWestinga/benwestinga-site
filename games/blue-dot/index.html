<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Dot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
            font-family: Arial, sans-serif;
        }

        /* =========================
           START / GAME OVER MENU
           ========================= */

        .menu {
            position: fixed;
            inset: 0;

            border: 8px solid black;
            background: white;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .menu h1 {
            margin: 0 0 30px 0;

            font-size: clamp(40px, 8vw, 90px);
        }

        .menu p {
            margin: 0 0 30px 0;

            font-size: clamp(22px, 4vw, 40px);

            color: rgba(0, 0, 0, 0.6);
        }

        .menu button {
            padding: 20px 60px;

            background: white;
            color: black;

            border: 6px solid black;

            font-size: clamp(25px, 5vw, 55px);
            font-weight: bold;

            cursor: pointer;
        }

        .menu button:hover {
            background: black;
            color: white;
        }

        /* =========================
           GAME
           ========================= */

        #gameScreen {
            display: none;

            position: fixed;
            inset: 0;

            border: 8px solid black;
            background: white;

            overflow: hidden;

            cursor: crosshair;
        }

        #playArea {
            position: absolute;

            left: 0;
            top: 0;
            right: 0;
            bottom: 0;

            overflow: hidden;
        }

        canvas {
            display: block;

            width: 100%;
            height: 100%;
        }

        /* =========================
           TIMER
           ========================= */

        #timer {
            position: absolute;

            top: 15px;
            left: 20px;

            z-index: 10;

            font-size: clamp(18px, 3vw, 30px);

            color: rgba(0, 0, 0, 0.35);

            pointer-events: none;

            font-variant-numeric: tabular-nums;
        }
    </style>
</head>

<body>

    <!-- =========================
         START SCREEN
         ========================= -->

    <div id="startScreen" class="menu">

        <h1>BLUE DOT</h1>

        <button id="playButton">
            SPEEL
        </button>

    </div>


    <!-- =========================
         GAME
         ========================= -->

    <div id="gameScreen">

        <div id="playArea">

            <canvas id="gameCanvas"></canvas>

            <div id="timer">
                0.00
            </div>

        </div>

    </div>


    <!-- =========================
         GAME OVER SCREEN
         ========================= -->

    <div
        id="gameOverScreen"
        class="menu"
        style="display: none;"
    >

        <h1>GAME OVER</h1>

        <p>
            Tijd: <span id="survivalTime">0.00</span> seconden
        </p>

        <button id="continueButton">
            VERDER
        </button>

    </div>


    <script>

        const startScreen =
            document.getElementById("startScreen");

        const gameScreen =
            document.getElementById("gameScreen");

        const gameOverScreen =
            document.getElementById("gameOverScreen");

        const playArea =
            document.getElementById("playArea");

        const canvas =
            document.getElementById("gameCanvas");

        const ctx =
            canvas.getContext("2d");

        const playButton =
            document.getElementById("playButton");

        const continueButton =
            document.getElementById("continueButton");

        const timerElement =
            document.getElementById("timer");

        const survivalTimeElement =
            document.getElementById("survivalTime");


        /* =========================
           GAME SIZE
           ========================= */

        let width = 0;
        let height = 0;


        /* =========================
           PLAYER
           ========================= */

        const player = {

            x: 0,
            y: 0,

            radius: 11
        };


        /* =========================
           ENEMIES
           ========================= */

        let enemies = [];

        const enemyRadius = 16;

        const safeSpawnRadius = 150;


        /* =========================
           BULLETS
           ========================= */

        let bullets = [];

        const bulletRadius = 4;

        const bulletSpeed = 6;

        const shotDelay = 180;

        let lastShot = 0;


        /* =========================
           GAME STATE
           ========================= */

        let gameRunning = false;

        let animationFrame = null;

        let startTime = 0;

        let lastSpawn = 0;


        /* =========================
           MOUSE
           ========================= */

        let mouseX = 0;
        let mouseY = 0;


        /* =========================
           RESIZE
           ========================= */

        function resizeCanvas() {

            const rect =
                playArea.getBoundingClientRect();

            width = rect.width;
            height = rect.height;


            const dpr =
                window.devicePixelRatio || 1;


            canvas.width =
                Math.round(width * dpr);

            canvas.height =
                Math.round(height * dpr);


            canvas.style.width =
                width + "px";

            canvas.style.height =
                height + "px";


            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );


            /*
                Zorg dat de speler altijd
                volledig binnen het speelveld blijft.
            */

            player.x = clamp(
                player.x,
                player.radius,
                width - player.radius
            );

            player.y = clamp(
                player.y,
                player.radius,
                height - player.radius
            );


            /*
                Zorg dat enemies ook volledig
                binnen het speelveld blijven.
            */

            for (const enemy of enemies) {

                enemy.x = clamp(
                    enemy.x,
                    enemy.radius,
                    width - enemy.radius
                );

                enemy.y = clamp(
                    enemy.y,
                    enemy.radius,
                    height - enemy.radius
                );
            }
        }


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        /* =========================
           CLAMP
           ========================= */

        function clamp(value, min, max) {

            return Math.max(
                min,
                Math.min(max, value)
            );
        }


        /* =========================
           MOUSE
           ========================= */

        canvas.addEventListener(
            "mousemove",
            function(event) {

                const rect =
                    canvas.getBoundingClientRect();


                mouseX =
                    event.clientX - rect.left;

                mouseY =
                    event.clientY - rect.top;


                /*
                    Speler kan nooit buiten
                    het speelveld komen.
                */

                player.x = clamp(
                    mouseX,
                    player.radius,
                    width - player.radius
                );

                player.y = clamp(
                    mouseY,
                    player.radius,
                    height - player.radius
                );
            }
        );


        /* =========================
           SPAWN RATE
           ========================= */

        function getSpawnRate(time) {

            const seconds =
                (time - startTime) / 1000;


            /*
                0 sec   = 1.0 sec
                20 sec  = 0.8 sec
                40 sec  = 0.6 sec
                60 sec  = 0.4 sec
                80 sec  = 0.2 sec
                100 sec = 0.1 sec
            */

            return Math.max(
                100,
                1000 - seconds * 9
            );
        }


        /* =========================
           SPAWN ENEMY
           ========================= */

        function spawnEnemy() {

            let x;
            let y;

            let valid = false;


            /*
                Probeer maximaal 100 posities.
            */

            for (
                let attempt = 0;
                attempt < 100;
                attempt++
            ) {

                x =
                    enemyRadius +
                    Math.random() *
                    (width - enemyRadius * 2);

                y =
                    enemyRadius +
                    Math.random() *
                    (height - enemyRadius * 2);


                const dx =
                    x - player.x;

                const dy =
                    y - player.y;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (
                    distance >=
                    safeSpawnRadius
                ) {

                    valid = true;

                    break;
                }
            }


            if (!valid) {
                return;
            }


            /*
                Random richting.
            */

            const angle =
                Math.random() *
                Math.PI *
                2;


            /*
                Random snelheid.
            */

            const speed =
                1.5 +
                Math.random() * 1.5;


            enemies.push({

                x: x,
                y: y,

                radius: enemyRadius,

                vx:
                    Math.cos(angle) *
                    speed,

                vy:
                    Math.sin(angle) *
                    speed
            });
        }


        /* =========================
           UPDATE ENEMIES
           ========================= */

        function updateEnemies() {

            for (const enemy of enemies) {

                enemy.x += enemy.vx;

                enemy.y += enemy.vy;


                /*
                    Links
                */

                if (
                    enemy.x -
                    enemy.radius <= 0
                ) {

                    enemy.x =
                        enemy.radius;

                    enemy.vx =
                        Math.abs(enemy.vx);
                }


                /*
                    Rechts
                */

                if (
                    enemy.x +
                    enemy.radius >= width
                ) {

                    enemy.x =
                        width -
                        enemy.radius;

                    enemy.vx =
                        -Math.abs(enemy.vx);
                }


                /*
                    Boven
                */

                if (
                    enemy.y -
                    enemy.radius <= 0
                ) {

                    enemy.y =
                        enemy.radius;

                    enemy.vy =
                        Math.abs(enemy.vy);
                }


                /*
                    Onder
                */

                if (
                    enemy.y +
                    enemy.radius >= height
                ) {

                    enemy.y =
                        height -
                        enemy.radius;

                    enemy.vy =
                        -Math.abs(enemy.vy);
                }
            }
        }


        /* =========================
           SHOOT
           ========================= */

        function shoot(time) {

            if (
                time - lastShot <
                shotDelay
            ) {
                return;
            }


            lastShot = time;


            /*
                Links van midden:
                naar rechts.

                Rechts van midden:
                naar links.
            */

            const direction =
                player.x <
                width / 2
                    ? 1
                    : -1;


            bullets.push({

                x: player.x,

                y: player.y,

                vx:
                    direction *
                    bulletSpeed,

                radius:
                    bulletRadius
            });
        }


        /* =========================
           UPDATE BULLETS
           ========================= */

        function updateBullets() {

            for (
                let i = bullets.length - 1;
                i >= 0;
                i--
            ) {

                const bullet =
                    bullets[i];


                bullet.x +=
                    bullet.vx;


                /*
                    Buiten scherm?
                */

                if (
                    bullet.x <
                        -bullet.radius ||

                    bullet.x >
                        width +
                        bullet.radius
                ) {

                    bullets.splice(i, 1);
                }
            }
        }


        /* =========================
           COLLISIONS
           ========================= */

        function checkCollisions() {

            /*
                KOGELS → ENEMIES
            */

            for (
                let i =
                    enemies.length - 1;
                i >= 0;
                i--
            ) {

                const enemy =
                    enemies[i];


                for (
                    let j =
                        bullets.length - 1;
                    j >= 0;
                    j--
                ) {

                    const bullet =
                        bullets[j];


                    const dx =
                        bullet.x -
                        enemy.x;

                    const dy =
                        bullet.y -
                        enemy.y;


                    const distance =
                        Math.sqrt(
                            dx * dx +
                            dy * dy
                        );


                    if (
                        distance <=
                        bullet.radius +
                        enemy.radius
                    ) {

                        enemies.splice(i, 1);

                        bullets.splice(j, 1);

                        break;
                    }
                }
            }


            /*
                SPELER → ENEMY
            */

            for (const enemy of enemies) {

                const dx =
                    player.x -
                    enemy.x;

                const dy =
                    player.y -
                    enemy.y;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (
                    distance <=
                    player.radius +
                    enemy.radius
                ) {

                    endGame();

                    return;
                }
            }
        }


        /* =========================
           DRAW
           ========================= */

        function draw() {

            /*
                WITTE ACHTERGROND
            */

            ctx.fillStyle =
                "white";

            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            /*
                MIDDENLIJN
            */

            ctx.beginPath();

            ctx.moveTo(
                width / 2,
                0
            );

            ctx.lineTo(
                width / 2,
                height
            );

            ctx.strokeStyle =
                "rgba(0, 0, 0, 0.22)";

            ctx.lineWidth = 2;

            ctx.stroke();


            /*
                RODE SPELER
            */

            ctx.beginPath();

            ctx.arc(
                player.x,
                player.y,
                player.radius,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "red";

            ctx.fill();


            /*
                BLAUWE BALLEN
            */

            for (const enemy of enemies) {

                ctx.beginPath();

                ctx.arc(
                    enemy.x,
                    enemy.y,
                    enemy.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    "blue";

                ctx.fill();
            }


            /*
                KOGELS
            */

            for (const bullet of bullets) {

                ctx.beginPath();

                ctx.arc(
                    bullet.x,
                    bullet.y,
                    bullet.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    "black";

                ctx.fill();
            }
        }


        /* =========================
           TIMER
           ========================= */

        function updateTimer(time) {

            const elapsed =
                (time - startTime) / 1000;


            timerElement.textContent =
                elapsed.toFixed(2);
        }


        /* =========================
           GAME LOOP
           ========================= */

        function gameLoop(time) {

            if (!gameRunning) {
                return;
            }


            /*
                TIMER
            */

            updateTimer(time);


            /*
                SPAWN RATE
            */

            const spawnRate =
                getSpawnRate(time);


            /*
                SPAWN
            */

            if (
                time - lastSpawn >=
                spawnRate
            ) {

                spawnEnemy();

                lastSpawn = time;
            }


            /*
                SCHIETEN
            */

            shoot(time);


            /*
                BEWEGEN
            */

            updateEnemies();

            updateBullets();


            /*
                COLLISIONS
            */

            checkCollisions();


            if (!gameRunning) {
                return;
            }


            /*
                TEKENEN
            */

            draw();


            animationFrame =
                requestAnimationFrame(
                    gameLoop
                );
        }


        /* =========================
           START GAME
           ========================= */

        function startGame() {

            /*
                Schermen
            */

            startScreen.style.display =
                "none";

            gameOverScreen.style.display =
                "none";

            gameScreen.style.display =
                "block";


            /*
                Canvas afmetingen
            */

            resizeCanvas();


            /*
                Reset
            */

            enemies = [];

            bullets = [];


            /*
                Speler in midden
            */

            player.x =
                width / 2;

            player.y =
                height / 2;


            mouseX =
                player.x;

            mouseY =
                player.y;


            /*
                Timer reset
            */

            startTime =
                performance.now();

            lastSpawn =
                startTime;

            lastShot =
                startTime;


            timerElement.textContent =
                "0.00";


            /*
                Start
            */

            gameRunning = true;


            cancelAnimationFrame(
                animationFrame
            );


            animationFrame =
                requestAnimationFrame(
                    gameLoop
                );
        }


        /* =========================
           GAME OVER
           ========================= */

        function endGame() {

            if (!gameRunning) {
                return;
            }


            /*
                Exacte overlevingstijd
            */

            const endTime =
                performance.now();


            const elapsed =
                (endTime - startTime) /
                1000;


            /*
                Stop game
            */

            gameRunning = false;


            cancelAnimationFrame(
                animationFrame
            );


            /*
                Toon eindtijd
            */

            survivalTimeElement.textContent =
                elapsed.toFixed(2);

            timerElement.textContent =
                elapsed.toFixed(2);


            /*
                Leeg game
            */

            enemies = [];

            bullets = [];


            /*
                Game scherm weg
            */

            gameScreen.style.display =
                "none";


            /*
                Game-over scherm
            */

            gameOverScreen.style.display =
                "flex";
        }


        /* =========================
           BUTTONS
           ========================= */

        playButton.addEventListener(
            "click",
            startGame
        );


        continueButton.addEventListener(
            "click",
            function() {

                gameOverScreen.style.display =
                    "none";

                startScreen.style.display =
                    "flex";
            }
        );

    </script>

</body>
</html>
```
