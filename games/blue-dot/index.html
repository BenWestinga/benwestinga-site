<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Dot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
            font-family: Arial, sans-serif;
        }

        /* =========================
           MAIN MENU
           ========================= */

        #menu {
            position: fixed;
            inset: 0;

            border: 8px solid black;
            background: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #playButton {
            padding: 20px 60px;

            background: white;
            color: black;

            border: 6px solid black;

            font-size: clamp(30px, 6vw, 70px);
            font-weight: bold;

            cursor: pointer;
        }

        #playButton:hover {
            background: black;
            color: white;
        }

        /* =========================
           GAME SCREEN
           ========================= */

        #gameScreen {
            display: none;

            position: fixed;
            inset: 0;

            border: 8px solid black;
            background: white;

            overflow: hidden;

            cursor: crosshair;
        }

        /*
            Dit is het daadwerkelijke speelveld.
            Het begint NA de zwarte rand.
        */

        #playArea {
            position: absolute;

            left: 0;
            top: 0;
            right: 0;
            bottom: 0;

            overflow: hidden;
        }

        canvas {
            display: block;

            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <!-- =========================
         MENU
         ========================= -->

    <div id="menu">
        <button id="playButton">SPEEL</button>
    </div>


    <!-- =========================
         GAME
         ========================= -->

    <div id="gameScreen">

        <div id="playArea">
            <canvas id="gameCanvas"></canvas>
        </div>

    </div>


    <script>

        const menu = document.getElementById("menu");
        const gameScreen = document.getElementById("gameScreen");
        const playArea = document.getElementById("playArea");
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const playButton = document.getElementById("playButton");


        /* =========================
           GAME SIZE
           ========================= */

        let width = 0;
        let height = 0;


        /* =========================
           PLAYER
           ========================= */

        const player = {
            x: 0,
            y: 0,
            radius: 11
        };


        /* =========================
           ENEMIES
           ========================= */

        let enemies = [];

        const enemyRadius = 16;


        /*
            Hoe dicht een enemy maximaal bij
            de speler mag spawnen.
        */

        const safeSpawnRadius = 150;


        /* =========================
           BULLETS
           ========================= */

        let bullets = [];

        const bulletRadius = 4;
        const bulletSpeed = 6;

        const shotDelay = 180;

        let lastShot = 0;


        /* =========================
           GAME LOOP
           ========================= */

        let animationFrame = null;
        let gameRunning = false;

        let startTime = 0;
        let lastSpawn = 0;


        /* =========================
           MOUSE
           ========================= */

        let mouseX = 0;
        let mouseY = 0;


        /* =========================
           RESIZE
           ========================= */

        function resizeCanvas() {

            const rect = playArea.getBoundingClientRect();

            width = rect.width;
            height = rect.height;

            const dpr = window.devicePixelRatio || 1;

            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);

            canvas.style.width = width + "px";
            canvas.style.height = height + "px";

            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );


            /*
                Houd speler volledig binnen het veld.
            */

            player.x = clamp(
                player.x,
                player.radius,
                width - player.radius
            );

            player.y = clamp(
                player.y,
                player.radius,
                height - player.radius
            );


            /*
                Houd enemies volledig binnen het veld.
            */

            for (const enemy of enemies) {

                enemy.x = clamp(
                    enemy.x,
                    enemy.radius,
                    width - enemy.radius
                );

                enemy.y = clamp(
                    enemy.y,
                    enemy.radius,
                    height - enemy.radius
                );
            }
        }


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        /* =========================
           CLAMP
           ========================= */

        function clamp(value, min, max) {

            return Math.max(
                min,
                Math.min(max, value)
            );
        }


        /* =========================
           MOUSE MOVEMENT
           ========================= */

        canvas.addEventListener(
            "mousemove",
            function(event) {

                const rect =
                    canvas.getBoundingClientRect();

                mouseX =
                    event.clientX - rect.left;

                mouseY =
                    event.clientY - rect.top;


                /*
                    Speler volgt cursor,
                    maar blijft volledig binnen.
                */

                player.x = clamp(
                    mouseX,
                    player.radius,
                    width - player.radius
                );

                player.y = clamp(
                    mouseY,
                    player.radius,
                    height - player.radius
                );
            }
        );


        /* =========================
           SPAWN RATE
           ========================= */

        function getSpawnRate(time) {

            const seconds =
                (time - startTime) / 1000;


            /*
                0 sec   = 1.0 sec
                20 sec  = 0.8 sec
                40 sec  = 0.6 sec
                60 sec  = 0.4 sec
                80 sec  = 0.2 sec
                100 sec = 0.1 sec
            */

            return Math.max(
                100,
                1000 - seconds * 9
            );
        }


        /* =========================
           SPAWN ENEMY
           ========================= */

        function spawnEnemy() {

            let x;
            let y;

            let valid = false;

            /*
                Probeer maximaal 100 keer
                een veilige positie te vinden.
            */

            for (let attempt = 0; attempt < 100; attempt++) {

                x =
                    enemyRadius +
                    Math.random() *
                    (width - enemyRadius * 2);

                y =
                    enemyRadius +
                    Math.random() *
                    (height - enemyRadius * 2);


                const dx =
                    x - player.x;

                const dy =
                    y - player.y;

                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (distance >= safeSpawnRadius) {

                    valid = true;

                    break;
                }
            }


            if (!valid) {
                return;
            }


            /*
                Random bewegingsrichting.
            */

            const angle =
                Math.random() *
                Math.PI *
                2;


            /*
                Verschillende snelheden zijn mogelijk,
                maar de bal blijft constant bewegen.
            */

            const speed =
                1.5 +
                Math.random() * 1.5;


            enemies.push({

                x: x,
                y: y,

                radius: enemyRadius,

                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed
            });
        }


        /* =========================
           UPDATE ENEMIES
           ========================= */

        function updateEnemies() {

            for (const enemy of enemies) {

                enemy.x += enemy.vx;
                enemy.y += enemy.vy;


                /*
                    Linkerkant
                */

                if (
                    enemy.x - enemy.radius <= 0
                ) {

                    enemy.x =
                        enemy.radius;

                    enemy.vx =
                        Math.abs(enemy.vx);
                }


                /*
                    Rechterkant
                */

                if (
                    enemy.x + enemy.radius >= width
                ) {

                    enemy.x =
                        width - enemy.radius;

                    enemy.vx =
                        -Math.abs(enemy.vx);
                }


                /*
                    Bovenkant
                */

                if (
                    enemy.y - enemy.radius <= 0
                ) {

                    enemy.y =
                        enemy.radius;

                    enemy.vy =
                        Math.abs(enemy.vy);
                }


                /*
                    Onderkant
                */

                if (
                    enemy.y + enemy.radius >= height
                ) {

                    enemy.y =
                        height - enemy.radius;

                    enemy.vy =
                        -Math.abs(enemy.vy);
                }
            }
        }


        /* =========================
           SHOOT
           ========================= */

        function shoot(time) {

            if (
                time - lastShot <
                shotDelay
            ) {
                return;
            }


            lastShot = time;


            /*
                Links van de middenlijn:
                schiet naar rechts.

                Rechts van de middenlijn:
                schiet naar links.
            */

            const direction =
                player.x < width / 2
                    ? 1
                    : -1;


            bullets.push({

                x: player.x,

                y: player.y,

                vx:
                    direction *
                    bulletSpeed,

                radius:
                    bulletRadius
            });
        }


        /* =========================
           UPDATE BULLETS
           ========================= */

        function updateBullets() {

            for (
                let i = bullets.length - 1;
                i >= 0;
                i--
            ) {

                const bullet =
                    bullets[i];


                bullet.x += bullet.vx;


                /*
                    Kogel buiten scherm?
                */

                if (
                    bullet.x <
                        -bullet.radius ||

                    bullet.x >
                        width + bullet.radius
                ) {

                    bullets.splice(i, 1);
                }
            }
        }


        /* =========================
           COLLISIONS
           ========================= */

        function checkCollisions() {

            /*
                KOGELS → BLAUWE BALLEN
            */

            for (
                let i = enemies.length - 1;
                i >= 0;
                i--
            ) {

                const enemy =
                    enemies[i];


                for (
                    let j = bullets.length - 1;
                    j >= 0;
                    j--
                ) {

                    const bullet =
                        bullets[j];


                    const dx =
                        bullet.x -
                        enemy.x;

                    const dy =
                        bullet.y -
                        enemy.y;


                    const distance =
                        Math.sqrt(
                            dx * dx +
                            dy * dy
                        );


                    if (
                        distance <=
                        bullet.radius +
                        enemy.radius
                    ) {

                        enemies.splice(i, 1);

                        bullets.splice(j, 1);

                        break;
                    }
                }
            }


            /*
                SPELER → BLAUWE BAL
            */

            for (const enemy of enemies) {

                const dx =
                    player.x -
                    enemy.x;

                const dy =
                    player.y -
                    enemy.y;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (
                    distance <=
                    player.radius +
                    enemy.radius
                ) {

                    endGame();

                    return;
                }
            }
        }


        /* =========================
           DRAW
           ========================= */

        function draw() {

            /*
                WITTE ACHTERGROND
            */

            ctx.fillStyle = "white";

            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            /*
                MIDDENLIJN

                Licht transparant.
            */

            ctx.beginPath();

            ctx.moveTo(
                width / 2,
                0
            );

            ctx.lineTo(
                width / 2,
                height
            );

            ctx.strokeStyle =
                "rgba(0, 0, 0, 0.22)";

            ctx.lineWidth = 2;

            ctx.stroke();


            /*
                RODE SPELER
            */

            ctx.beginPath();

            ctx.arc(
                player.x,
                player.y,
                player.radius,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = "red";

            ctx.fill();


            /*
                BLAUWE BALLEN
            */

            for (const enemy of enemies) {

                ctx.beginPath();

                ctx.arc(
                    enemy.x,
                    enemy.y,
                    enemy.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = "blue";

                ctx.fill();
            }


            /*
                KOGELS
            */

            for (const bullet of bullets) {

                ctx.beginPath();

                ctx.arc(
                    bullet.x,
                    bullet.y,
                    bullet.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = "black";

                ctx.fill();
            }
        }


        /* =========================
           GAME LOOP
           ========================= */

        function gameLoop(time) {

            if (!gameRunning) {
                return;
            }


            /*
                Nieuwe spawn rate berekenen.
            */

            const spawnRate =
                getSpawnRate(time);


            /*
                Nieuwe blauwe bal.
            */

            if (
                time - lastSpawn >=
                spawnRate
            ) {

                spawnEnemy();

                lastSpawn = time;
            }


            /*
                Automatisch schieten.
            */

            shoot(time);


            /*
                Beweging.
            */

            updateEnemies();

            updateBullets();


            /*
                Botsingen.
            */

            checkCollisions();


            /*
                Tekenen.
            */

            draw();


            animationFrame =
                requestAnimationFrame(
                    gameLoop
                );
        }


        /* =========================
           START
           ========================= */

        function startGame() {

            menu.style.display =
                "none";

            gameScreen.style.display =
                "block";


            /*
                Canvas eerst goed meten.
            */

            resizeCanvas();


            /*
                Alles resetten.
            */

            enemies = [];

            bullets = [];


            /*
                Speler midden.
            */

            player.x =
                width / 2;

            player.y =
                height / 2;


            mouseX =
                player.x;

            mouseY =
                player.y;


            /*
                Timers resetten.
            */

            startTime =
                performance.now();

            lastSpawn =
                startTime;

            lastShot =
                startTime;


            gameRunning = true;


            cancelAnimationFrame(
                animationFrame
            );


            animationFrame =
                requestAnimationFrame(
                    gameLoop
                );
        }


        /* =========================
           GAME OVER
           ========================= */

        function endGame() {

            gameRunning = false;


            cancelAnimationFrame(
                animationFrame
            );


            enemies = [];

            bullets = [];


            /*
                Terug naar menu.
            */

            gameScreen.style.display =
                "none";

            menu.style.display =
                "flex";
        }


        /* =========================
           PLAY BUTTON
           ========================= */

        playButton.addEventListener(
            "click",
            startGame
        );

    </script>

</body>
</html>
