```html
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blue Dot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
            font-family: Arial, sans-serif;
        }

        #menu {
            width: 100vw;
            height: 100vh;
            border: 8px solid black;

            display: flex;
            justify-content: center;
            align-items: center;

            background: white;
        }

        #playButton {
            padding: 20px 60px;

            font-size: clamp(30px, 6vw, 70px);
            font-weight: bold;

            background: white;
            color: black;

            border: 6px solid black;

            cursor: pointer;
        }

        #playButton:hover {
            background: black;
            color: white;
        }

        #gameScreen {
            display: none;

            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            border: 8px solid black;

            background: white;

            overflow: hidden;

            cursor: crosshair;
        }

        canvas {
            display: block;

            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <!-- MAIN MENU -->
    <div id="menu">
        <button id="playButton">SPEEL</button>
    </div>

    <!-- GAME -->
    <div id="gameScreen">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const menu = document.getElementById("menu");
        const gameScreen = document.getElementById("gameScreen");
        const playButton = document.getElementById("playButton");

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let width = 0;
        let height = 0;

        /*
            PLAYER
        */
        const player = {
            x: 0,
            y: 0,
            radius: 13
        };

        /*
            BLUE ENEMIES
        */
        let enemies = [];

        /*
            BULLETS
        */
        let bullets = [];

        /*
            MOUSE
        */
        let mouseX = 0;
        let mouseY = 0;

        /*
            GAME
        */
        let gameRunning = false;
        let animationFrame;

        let startTime = 0;

        /*
            SHOOTING
        */
        let lastShot = 0;

        const bulletSpeed = 6;
        const bulletRadius = 4;

        /*
            ENEMY
        */
        const enemyRadius = 16;

        /*
            PLAYER/ENEMY SAFE SPAWN RADIUS

            Een blauwe bal kan nooit binnen deze afstand
            van de speler verschijnen.
        */
        const safeSpawnRadius = 140;

        /*
            START SPAWN RATE
        */
        let spawnRate = 1000;
        let lastSpawn = 0;


        /*
            =========================
            RESIZE
            =========================
        */

        function resizeCanvas() {

            const rect = gameScreen.getBoundingClientRect();

            width = rect.width;
            height = rect.height;

            const devicePixelRatio = window.devicePixelRatio || 1;

            canvas.width = width * devicePixelRatio;
            canvas.height = height * devicePixelRatio;

            canvas.style.width = width + "px";
            canvas.style.height = height + "px";

            ctx.setTransform(
                devicePixelRatio,
                0,
                0,
                devicePixelRatio,
                0,
                0
            );

            /*
                Houd speler binnen het speelveld
            */

            player.x = Math.max(
                player.radius,
                Math.min(width - player.radius, player.x)
            );

            player.y = Math.max(
                player.radius,
                Math.min(height - player.radius, player.y)
            );
        }


        /*
            =========================
            MOUSE
            =========================
        */

        function updateMouse(event) {

            const rect = canvas.getBoundingClientRect();

            mouseX = event.clientX - rect.left;
            mouseY = event.clientY - rect.top;

            /*
                Rode bal volgt cursor
            */

            player.x = Math.max(
                player.radius,
                Math.min(width - player.radius, mouseX)
            );

            player.y = Math.max(
                player.radius,
                Math.min(height - player.radius, mouseY)
            );
        }


        canvas.addEventListener("mousemove", updateMouse);


        /*
            =========================
            SPAWN RATE
            =========================

            0 sec  = 1.0 sec
            20 sec = 0.8 sec
            40 sec = 0.6 sec
            60 sec = 0.4 sec
            80 sec = 0.2 sec
            100 sec = 0.1 sec

            Daarna blijft het 0.1 sec.
        */

        function updateSpawnRate(time) {

            const elapsed = (time - startTime) / 1000;

            spawnRate = Math.max(
                100,
                1000 - elapsed * 10
            );
        }


        /*
            =========================
            SPAWN ENEMY
            =========================
        */

        function spawnEnemy() {

            let x;
            let y;

            let attempts = 0;

            do {

                x = enemyRadius +
                    Math.random() * (width - enemyRadius * 2);

                y = enemyRadius +
                    Math.random() * (height - enemyRadius * 2);

                attempts++;

                const dx = x - player.x;
                const dy = y - player.y;

                const distance = Math.sqrt(
                    dx * dx + dy * dy
                );

                /*
                    Als de enemy veilig staat:
                    stop met zoeken.
                */

                if (distance >= safeSpawnRadius) {
                    break;
                }

            } while (attempts < 100);


            /*
                Alleen toevoegen als hij niet op de speler staat.
            */

            const dx = x - player.x;
            const dy = y - player.y;

            const distance = Math.sqrt(
                dx * dx + dy * dy
            );

            if (distance >= safeSpawnRadius) {

                enemies.push({
                    x: x,
                    y: y,
                    radius: enemyRadius
                });
            }
        }


        /*
            =========================
            SHOOT BULLET
            =========================
        */

        function shoot(time) {

            /*
                Schiet niet continu zonder limiet.

                De vuursnelheid is ongeveer 5 kogels
                per seconde.
            */

            if (time - lastShot < 200) {
                return;
            }

            lastShot = time;

            /*
                Links van midden:
                schiet naar rechts.

                Rechts van midden:
                schiet naar links.
            */

            const direction =
                player.x < width / 2
                    ? 1
                    : -1;

            bullets.push({
                x: player.x,
                y: player.y,
                vx: direction * bulletSpeed,
                radius: bulletRadius
            });
        }


        /*
            =========================
            UPDATE BULLETS
            =========================
        */

        function updateBullets() {

            for (let i = bullets.length - 1; i >= 0; i--) {

                const bullet = bullets[i];

                bullet.x += bullet.vx;

                /*
                    Verwijder kogels die uit beeld zijn.
                */

                if (
                    bullet.x < -20 ||
                    bullet.x > width + 20
                ) {
                    bullets.splice(i, 1);
                }
            }
        }


        /*
            =========================
            COLLISIONS
            =========================
        */

        function checkCollisions() {

            /*
                KOGEL → ENEMY
            */

            for (let i = enemies.length - 1; i >= 0; i--) {

                const enemy = enemies[i];

                let enemyHit = false;

                for (let j = bullets.length - 1; j >= 0; j--) {

                    const bullet = bullets[j];

                    const dx = bullet.x - enemy.x;
                    const dy = bullet.y - enemy.y;

                    const distance = Math.sqrt(
                        dx * dx + dy * dy
                    );

                    if (
                        distance <=
                        bullet.radius + enemy.radius
                    ) {

                        enemies.splice(i, 1);

                        bullets.splice(j, 1);

                        enemyHit = true;

                        break;
                    }
                }

                if (enemyHit) {
                    continue;
                }
            }


            /*
                PLAYER → ENEMY
            */

            for (const enemy of enemies) {

                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;

                const distance = Math.sqrt(
                    dx * dx + dy * dy
                );

                if (
                    distance <=
                    player.radius + enemy.radius
                ) {

                    endGame();

                    return;
                }
            }
        }


        /*
            =========================
            DRAW
            =========================
        */

        function draw() {

            /*
                WHITE BACKGROUND
            */

            ctx.fillStyle = "white";

            ctx.fillRect(
                0,
                0,
                width,
                height
            );


            /*
                MIDDENLIJN

                Transparant/grijs zodat hij zichtbaar is,
                maar niet overheerst.
            */

            ctx.beginPath();

            ctx.moveTo(
                width / 2,
                0
            );

            ctx.lineTo(
                width / 2,
                height
            );

            ctx.strokeStyle = "rgba(0, 0, 0, 0.25)";
            ctx.lineWidth = 2;

            ctx.stroke();


            /*
                PLAYER
            */

            ctx.beginPath();

            ctx.arc(
                player.x,
                player.y,
                player.radius,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = "red";

            ctx.fill();


            /*
                ENEMIES
            */

            for (const enemy of enemies) {

                ctx.beginPath();

                ctx.arc(
                    enemy.x,
                    enemy.y,
                    enemy.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = "blue";

                ctx.fill();
            }


            /*
                BULLETS
            */

            for (const bullet of bullets) {

                ctx.beginPath();

                ctx.arc(
                    bullet.x,
                    bullet.y,
                    bullet.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = "black";

                ctx.fill();
            }
        }


        /*
            =========================
            GAME LOOP
            =========================
        */

        function gameLoop(time) {

            if (!gameRunning) {
                return;
            }

            /*
                Spawn snelheid aanpassen
            */

            updateSpawnRate(time);


            /*
                Nieuwe enemy
            */

            if (
                time - lastSpawn >= spawnRate
            ) {

                spawnEnemy();

                lastSpawn = time;
            }


            /*
                Schieten
            */

            shoot(time);


            /*
                Updates
            */

            updateBullets();

            checkCollisions();


            /*
                Tekenen
            */

            draw();


            /*
                Volgende frame
            */

            animationFrame =
                requestAnimationFrame(gameLoop);
        }


        /*
            =========================
            START GAME
            =========================
        */

        function startGame() {

            menu.style.display = "none";

            gameScreen.style.display = "block";

            resizeCanvas();

            /*
                Reset
            */

            enemies = [];

            bullets = [];

            /*
                Start speler in het midden
            */

            player.x = width / 2;
            player.y = height / 2;

            mouseX = player.x;
            mouseY = player.y;

            /*
                Reset timers
            */

            startTime = performance.now();

            lastSpawn = startTime;

            lastShot = startTime;

            spawnRate = 1000;

            gameRunning = true;

            cancelAnimationFrame(animationFrame);

            animationFrame =
                requestAnimationFrame(gameLoop);
        }


        /*
            =========================
            END GAME
            =========================
        */

        function endGame() {

            gameRunning = false;

            cancelAnimationFrame(animationFrame);

            enemies = [];

            bullets = [];

            gameScreen.style.display = "none";

            menu.style.display = "flex";
        }


        /*
            =========================
            PLAY BUTTON
            =========================
        */

        playButton.addEventListener(
            "click",
            startGame
        );


        /*
            =========================
            RESIZE
            =========================
        */

        window.addEventListener(
            "resize",
            resizeCanvas
        );
    </script>

</body>
</html>
