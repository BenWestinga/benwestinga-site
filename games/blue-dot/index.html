<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blue Dot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
            font-family: Arial, sans-serif;
        }

        #game {
            width: 100vw;
            height: 100vh;
        }

        /* MAIN MENU */
        #menu {
            width: 100%;
            height: 100%;
            border: 8px solid black;
            background: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #playButton {
            font-size: clamp(30px, 6vw, 70px);
            font-weight: bold;
            padding: 20px 60px;

            background: white;
            color: black;

            border: 6px solid black;
            cursor: pointer;
        }

        #playButton:hover {
            background: black;
            color: white;
        }

        /* GAME */
        #gameScreen {
            display: none;
            position: relative;

            width: 100%;
            height: 100%;

            border: 8px solid black;
            background: white;

            overflow: hidden;
        }

        /* Everything inside this area is guaranteed to stay
           inside the black border. */
        #playArea {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }

        .dot {
            position: absolute;

            border-radius: 50%;

            transform: translate(-50%, -50%);

            pointer-events: none;
        }

        /* PLAYER */
        #player {
            width: 28px;
            height: 28px;

            background: red;
        }

        /* ENEMY */
        #blueDot {
            width: 36px;
            height: 36px;

            background: blue;
        }
    </style>
</head>

<body>

<div id="game">

    <!-- MAIN MENU -->
    <div id="menu">
        <button id="playButton">SPEEL</button>
    </div>

    <!-- GAME -->
    <div id="gameScreen">

        <div id="playArea">
            <div id="player" class="dot"></div>
            <div id="blueDot" class="dot"></div>
        </div>

    </div>

</div>

<script>
    const menu = document.getElementById("menu");
    const gameScreen = document.getElementById("gameScreen");
    const playArea = document.getElementById("playArea");

    const playButton = document.getElementById("playButton");

    const player = document.getElementById("player");
    const blueDot = document.getElementById("blueDot");

    const keys = {
        ArrowUp: false,
        ArrowDown: false,
        ArrowLeft: false,
        ArrowRight: false
    };

    let playerX = 0;
    let playerY = 0;

    let blueX = 0;
    let blueY = 0;

    let blueVX = 0;
    let blueVY = 0;

    let animationFrame = null;

    /*
        SPEEDS
        These values are pixels per frame.
    */
    const playerSpeed = 4;
    const blueSpeed = 3;

    function startGame() {

        menu.style.display = "none";
        gameScreen.style.display = "block";

        const width = playArea.clientWidth;
        const height = playArea.clientHeight;

        const playerRadius = player.offsetWidth / 2;
        const blueRadius = blueDot.offsetWidth / 2;

        // Starting positions
        playerX = width * 0.25;
        playerY = height * 0.5;

        blueX = width * 0.70;
        blueY = height * 0.30;

        // Random direction for blue ball
        const angle = Math.random() * Math.PI * 2;

        blueVX = Math.cos(angle) * blueSpeed;
        blueVY = Math.sin(angle) * blueSpeed;

        // Make absolutely sure both balls start inside
        playerX = clamp(
            playerX,
            playerRadius,
            width - playerRadius
        );

        playerY = clamp(
            playerY,
            playerRadius,
            height - playerRadius
        );

        blueX = clamp(
            blueX,
            blueRadius,
            width - blueRadius
        );

        blueY = clamp(
            blueY,
            blueRadius,
            height - blueRadius
        );

        cancelAnimationFrame(animationFrame);

        gameLoop();
    }

    function endGame() {

        cancelAnimationFrame(animationFrame);

        animationFrame = null;

        // Return to menu
        gameScreen.style.display = "none";
        menu.style.display = "flex";
    }

    function clamp(value, minimum, maximum) {

        return Math.max(
            minimum,
            Math.min(maximum, value)
        );
    }

    function gameLoop() {

        const width = playArea.clientWidth;
        const height = playArea.clientHeight;

        const playerRadius = player.offsetWidth / 2;
        const blueRadius = blueDot.offsetWidth / 2;

        /*
            =========================
            PLAYER MOVEMENT
            =========================
        */

        if (keys.ArrowUp) {
            playerY -= playerSpeed;
        }

        if (keys.ArrowDown) {
            playerY += playerSpeed;
        }

        if (keys.ArrowLeft) {
            playerX -= playerSpeed;
        }

        if (keys.ArrowRight) {
            playerX += playerSpeed;
        }

        /*
            Keep the ENTIRE red ball inside.
        */

        playerX = clamp(
            playerX,
            playerRadius,
            width - playerRadius
        );

        playerY = clamp(
            playerY,
            playerRadius,
            height - playerRadius
        );

        /*
            =========================
            BLUE BALL MOVEMENT
            =========================
        */

        blueX += blueVX;
        blueY += blueVY;

        /*
            LEFT WALL
        */

        if (blueX - blueRadius <= 0) {

            blueX = blueRadius;

            blueVX = Math.abs(blueVX);
        }

        /*
            RIGHT WALL
        */

        if (blueX + blueRadius >= width) {

            blueX = width - blueRadius;

            blueVX = -Math.abs(blueVX);
        }

        /*
            TOP WALL
        */

        if (blueY - blueRadius <= 0) {

            blueY = blueRadius;

            blueVY = Math.abs(blueVY);
        }

        /*
            BOTTOM WALL
        */

        if (blueY + blueRadius >= height) {

            blueY = height - blueRadius;

            blueVY = -Math.abs(blueVY);
        }

        /*
            =========================
            DRAW
            =========================
        */

        player.style.left = playerX + "px";
        player.style.top = playerY + "px";

        blueDot.style.left = blueX + "px";
        blueDot.style.top = blueY + "px";

        /*
            =========================
            COLLISION
            =========================
        */

        const dx = playerX - blueX;
        const dy = playerY - blueY;

        const distance = Math.sqrt(
            dx * dx + dy * dy
        );

        if (distance <= playerRadius + blueRadius) {

            endGame();

            return;
        }

        animationFrame = requestAnimationFrame(gameLoop);
    }

    /*
        =========================
        KEYBOARD CONTROLS
        =========================
    */

    document.addEventListener("keydown", function(event) {

        if (event.key in keys) {

            keys[event.key] = true;

            event.preventDefault();
        }
    });

    document.addEventListener("keyup", function(event) {

        if (event.key in keys) {

            keys[event.key] = false;

            event.preventDefault();
        }
    });

    /*
        =========================
        PLAY BUTTON
        =========================
    */

    playButton.addEventListener("click", function() {

        startGame();

    });

    /*
        =========================
        WINDOW RESIZE
        =========================
    */

    window.addEventListener("resize", function() {

        if (gameScreen.style.display === "none") {
            return;
        }

        const width = playArea.clientWidth;
        const height = playArea.clientHeight;

        const playerRadius = player.offsetWidth / 2;
        const blueRadius = blueDot.offsetWidth / 2;

        // Keep player inside after resizing
        playerX = clamp(
            playerX,
            playerRadius,
            width - playerRadius
        );

        playerY = clamp(
            playerY,
            playerRadius,
            height - playerRadius
        );

        // Keep blue ball inside after resizing
        blueX = clamp(
            blueX,
            blueRadius,
            width - blueRadius
        );

        blueY = clamp(
            blueY,
            blueRadius,
            height - blueRadius
        );

    });
</script>

</body>
</html>
