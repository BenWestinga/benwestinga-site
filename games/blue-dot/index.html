```html
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Dot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- STARTSCHERM -->
    <div id="startScreen" class="screen">

        <h1>BLUE DOT</h1>

        <button id="playButton">
            SPEEL
        </button>

        <button id="leaderboardButton">
            TOP 5
        </button>

    </div>


    <!-- NAAM INVOEREN -->
    <div id="nameScreen" class="screen hidden">

        <h1>NAAM</h1>

        <input
            id="nameInput"
            type="text"
            maxlength="20"
            placeholder="Voer je naam in"
            autocomplete="off"
        >

        <button id="startGameButton">
            START
        </button>

        <button id="backFromNameButton">
            TERUG
        </button>

    </div>


    <!-- GAME -->
    <div id="gameScreen">

        <div id="playArea">

            <canvas id="gameCanvas"></canvas>

            <div id="timer">
                0.00
            </div>

        </div>

    </div>


    <!-- GAME OVER -->
    <div id="gameOverScreen" class="screen hidden">

        <h1>GAME OVER</h1>

        <p>
            <span id="playerName"></span>
        </p>

        <p>
            Tijd: <span id="survivalTime">0.00</span> seconden
        </p>

        <p id="scoreMessage"></p>

        <button id="continueButton">
            VERDER
        </button>

    </div>


    <!-- TOP 5 -->
    <div id="leaderboardScreen" class="screen hidden">

        <h1>TOP 5</h1>

        <div id="leaderboard">
            Laden...
        </div>

        <button id="backFromLeaderboardButton">
            TERUG
        </button>

    </div>


    <script src="leaderboard.js"></script>
    <script src="game.js"></script>

</body>
</html>
```
