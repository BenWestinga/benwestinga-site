<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blue Dot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
            font-family: Arial, sans-serif;
        }

        #game {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #menu,
        #gameScreen {
            width: 100%;
            height: 100%;
            border: 8px solid black;
            background: white;
        }

        #menu {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #playButton {
            font-size: clamp(30px, 6vw, 70px);
            font-weight: bold;
            padding: 20px 60px;
            background: white;
            border: 6px solid black;
            cursor: pointer;
        }

        #playButton:hover {
            background: black;
            color: white;
        }

        #gameScreen {
            display: none;
            position: relative;
            overflow: hidden;
        }

        .dot {
            position: absolute;
            width: clamp(25px, 4vw, 50px);
            height: clamp(25px, 4vw, 50px);
            border-radius: 50%;
        }

        #player {
            background: red;
            left: 20%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #blueDot {
            background: blue;
            left: 70%;
            top: 30%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>

<div id="game">

    <!-- MAIN MENU -->
    <div id="menu">
        <button id="playButton">SPEEL</button>
    </div>

    <!-- GAME -->
    <div id="gameScreen">
        <div id="player" class="dot"></div>
        <div id="blueDot" class="dot"></div>
    </div>

</div>

<script>
    const menu = document.getElementById("menu");
    const gameScreen = document.getElementById("gameScreen");
    const playButton = document.getElementById("playButton");

    const player = document.getElementById("player");
    const blueDot = document.getElementById("blueDot");

    const keys = {
        ArrowUp: false,
        ArrowDown: false,
        ArrowLeft: false,
        ArrowRight: false
    };

    let playerX;
    let playerY;

    let blueX;
    let blueY;

    let blueVX;
    let blueVY;

    let animationFrame;

    const playerSpeed = 0.45;
    const blueSpeed = 0.35;

    function startGame() {
        menu.style.display = "none";
        gameScreen.style.display = "block";

        const rect = gameScreen.getBoundingClientRect();

        playerX = rect.width * 0.25;
        playerY = rect.height * 0.5;

        blueX = rect.width * 0.7;
        blueY = rect.height * 0.3;

        // Random direction, but constant speed
        const angle = Math.random() * Math.PI * 2;

        blueVX = Math.cos(angle) * blueSpeed;
        blueVY = Math.sin(angle) * blueSpeed;

        cancelAnimationFrame(animationFrame);
        gameLoop();
    }

    function endGame() {
        cancelAnimationFrame(animationFrame);

        gameScreen.style.display = "none";
        menu.style.display = "flex";
    }

    function gameLoop() {
        const rect = gameScreen.getBoundingClientRect();

        const playerRadius = player.offsetWidth / 2;
        const blueRadius = blueDot.offsetWidth / 2;

        // PLAYER MOVEMENT
        if (keys.ArrowUp) {
            playerY -= playerSpeed;
        }

        if (keys.ArrowDown) {
            playerY += playerSpeed;
        }

        if (keys.ArrowLeft) {
            playerX -= playerSpeed;
        }

        if (keys.ArrowRight) {
            playerX += playerSpeed;
        }

        // Keep player inside the screen
        playerX = Math.max(
            playerRadius,
            Math.min(rect.width - playerRadius, playerX)
        );

        playerY = Math.max(
            playerRadius,
            Math.min(rect.height - playerRadius, playerY)
        );

        // BLUE DOT MOVEMENT
        blueX += blueVX;
        blueY += blueVY;

        // Bounce off left/right walls
        if (blueX - blueRadius <= 0) {
            blueX = blueRadius;
            blueVX *= -1;
        }

        if (blueX + blueRadius >= rect.width) {
            blueX = rect.width - blueRadius;
            blueVX *= -1;
        }

        // Bounce off top/bottom walls
        if (blueY - blueRadius <= 0) {
            blueY = blueRadius;
            blueVY *= -1;
        }

        if (blueY + blueRadius >= rect.height) {
            blueY = rect.height - blueRadius;
            blueVY *= -1;
        }

        // Draw player
        player.style.left = playerX + "px";
        player.style.top = playerY + "px";

        // Draw blue dot
        blueDot.style.left = blueX + "px";
        blueDot.style.top = blueY + "px";

        // COLLISION
        const distance = Math.sqrt(
            Math.pow(playerX - blueX, 2) +
            Math.pow(playerY - blueY, 2)
        );

        if (distance <= playerRadius + blueRadius) {
            endGame();
            return;
        }

        animationFrame = requestAnimationFrame(gameLoop);
    }

    // KEYBOARD
    document.addEventListener("keydown", (event) => {
        if (event.key in keys) {
            keys[event.key] = true;
            event.preventDefault();
        }
    });

    document.addEventListener("keyup", (event) => {
        if (event.key in keys) {
            keys[event.key] = false;
            event.preventDefault();
        }
    });

    // START GAME
    playButton.addEventListener("click", startGame);

    // Reset positions when screen size changes
    window.addEventListener("resize", () => {
        if (gameScreen.style.display !== "none") {
            const rect = gameScreen.getBoundingClientRect();

            playerX = Math.max(
                player.offsetWidth / 2,
                Math.min(rect.width - player.offsetWidth / 2, playerX)
            );

            playerY = Math.max(
                player.offsetHeight / 2,
                Math.min(rect.height - player.offsetHeight / 2, playerY)
            );
        }
    });
</script>

</body>
</html>
