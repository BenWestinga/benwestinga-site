<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Game</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main>

        <h1>NEW GAME</h1>

        <div id="account-menu">

            <button id="show-login">
                LOG IN
            </button>

            <button id="show-register">
                CREATE NEW ACCOUNT
            </button>

        </div>

        <form id="login-form" hidden>

            <h2>Log In</h2>

            <input
                id="login-username"
                type="text"
                placeholder="Username"
                required
            >

            <input
                id="login-password"
                type="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                LOG IN
            </button>

            <button
                type="button"
                class="back-button"
            >
                BACK
            </button>

        </form>

        <form id="register-form" hidden>

            <h2>Create Account</h2>

            <input
                id="register-username"
                type="text"
                placeholder="Username"
                minlength="5"
                maxlength="25"
                required
            >

            <p>Username must be 5–25 characters.</p>

            <input
                id="register-password"
                type="password"
                placeholder="Password"
                minlength="8"
                required
            >

            <input
                id="register-password-confirm"
                type="password"
                placeholder="Confirm password"
                minlength="8"
                required
            >

            <button type="submit">
                CREATE ACCOUNT
            </button>

            <button
                type="button"
                class="back-button"
            >
                BACK
            </button>

        </form>

        <section id="game-menu" hidden>

    <h2>MAIN MENU</h2>

    <p>
        Logged in as:
        <strong id="current-user"></strong>
    </p>

    <button id="story-button">
        STORY MODE
    </button>

    <button id="endless-button">
        ENDLESS MODE
    </button>

    <button id="logout-button">
        LOG OUT
    </button>

</section>


<section id="story-map" hidden>

    <canvas
        id="map-canvas"
        width="960"
        height="540"
    ></canvas>

    <button id="leave-map-button">
        BACK TO MENU
    </button>

</section>

        <p id="message"></p>

    </main>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
    <script src="screens/map.js"></script>

</body>
</html>
