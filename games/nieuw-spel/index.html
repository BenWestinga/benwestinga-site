<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Game</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/level.css">
</head>

<body>

    <main>

        <h1>NEW GAME</h1>


        <!-- ACCOUNT MENU -->

        <div id="account-menu">

            <button id="show-login">
                LOG IN
            </button>

            <button id="show-register">
                CREATE NEW ACCOUNT
            </button>

        </div>


        <!-- LOGIN -->

        <form id="login-form" hidden>

            <h2>Log In</h2>

            <input
                id="login-username"
                type="text"
                placeholder="Username"
                required
            >

            <input
                id="login-password"
                type="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                LOG IN
            </button>

            <button
                type="button"
                class="back-button"
            >
                BACK
            </button>

        </form>


        <!-- CREATE ACCOUNT -->

        <form id="register-form" hidden>

            <h2>Create Account</h2>

            <input
                id="register-username"
                type="text"
                placeholder="Username"
                minlength="5"
                maxlength="25"
                required
            >

            <p>
                Username must be 5–25 characters.
            </p>

            <input
                id="register-password"
                type="password"
                placeholder="Password"
                minlength="8"
                required
            >

            <input
                id="register-password-confirm"
                type="password"
                placeholder="Confirm password"
                minlength="8"
                required
            >

            <button type="submit">
                CREATE ACCOUNT
            </button>

            <button
                type="button"
                class="back-button"
            >
                BACK
            </button>

        </form>


        <!-- MAIN MENU -->

        <section id="game-menu" hidden>

            <h2>MAIN MENU</h2>

            <p>
                Logged in as:
                <strong id="current-user"></strong>
            </p>

            <button id="story-button">
                STORY MODE
            </button>

            <button id="endless-button">
                ENDLESS MODE
            </button>

            <button id="logout-button">
                LOG OUT
            </button>

        </section>


        <!-- STORY MAP -->

        <section id="story-map" hidden>

            <canvas
                id="map-canvas"
                width="960"
                height="540"
            ></canvas>

        </section>


        <!-- LEVEL -->

        <section id="level-screen" hidden>

            <canvas id="level-canvas"></canvas>

        </section>


        <!-- PAUSE MENU -->

        <div id="pause-menu" hidden>

            <div id="pause-menu-box">

                <h2>PAUSED</h2>

                <button id="continue-button">
                    CONTINUE
                </button>

                <button
                    id="leave-level-button"
                    hidden
                >
                    LEAVE LEVEL
                </button>

                <button id="leave-story-button">
                    LEAVE STORY MODE
                </button>

            </div>

        </div>


        <!-- THREE-LINE MENU BUTTON -->

        <button
            id="menu-button"
            hidden
        >
            ☰
        </button>


        <p id="message"></p>

    </main>


    <script src="js/api.js"></script>
    <script src="js/login.js"></script>

    <script src="screens/map.js"></script>

    <script src="game/player.js"></script>
    <script src="game/combat.js"></script>

    <script src="enemies/enemy-01.js"></script>

    <script src="game/level-engine.js"></script>

    <script src="levels/level-01.js"></script>

    <script src="screens/pause-menu.js"></script>

</body>
</html>
